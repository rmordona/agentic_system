events {}

http {
    server {
        listen 8080;

        # with this, you can use the curl http://localhost:8080/ollama/api/chat 
        # inside the engine, it will reroute to http://<container host>:11434/api/chat

        location /ollama/ {
            proxy_pass http://host.containers.internal:11434/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Ollama streams responses
            proxy_buffering off;
        }

        # Creating an http route for /api instead

        location /api/ {
            proxy_pass http://host.containers.internal:11434/api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Ollama streams responses
            proxy_buffering off;
        }

    }
}
