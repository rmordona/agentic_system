type: object
description: "Agnostic Tool Contract for High-Precision Technical Stock Analysis"
properties:
  tool_name:
    type: string
    const: "get_ticker_stats"
  description:
    type: string
    const: "Returns high-precision technical data for a specific stock ticker, including Moving Averages, RSI, and Z-Score volatility."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker]
    properties:
      ticker:
        type: string
        pattern: "^[A-Z]{1,5}$"
        description: "The stock symbol (e.g., AAPL, NVDA, TSLA)."

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    required: [ticker, current_price, MA50, MA200, RSI, volatility_z_score, daily_volume]
    properties:
      ticker: { type: string }
      current_price: { type: number }
      MA50: { type: number }
      MA200: { type: number }
      RSI: { type: number, minimum: 0, maximum: 100 }
      volatility_z_score: { type: number }
      daily_volume: { type: integer, minimum: 0 }

# --- GATEKEEPER PREDICATES ---
validation_rules:
  # Ensure RSI is physically possible and volume is significant
  - "RSI >= 0 AND RSI <= 100"
  - "current_price > 0 AND daily_volume > 0"

# --- HITL ESCALATION POLICY ---
hitl_policy:
  trigger_conditions:
    # 1. Statistical Outlier: Volatility Z-Score is extremely high (> 3.0)
    # This suggests a "Black Swan" or news-driven event that indicators can't model.
    - condition: "volatility_z_score >= 3.0"
      reason: "EXTREME_VOLATILITY_ANOMALY"

    # 2. Indicator Divergence: Price is above MA50 but RSI is crashing (< 30)
    # Suggests the trend is losing internal strength despite the price action.
    - condition: "current_price > MA50 AND RSI < 30"
      reason: "BULLISH_TREND_BEARISH_MOMENTUM_DIVERGENCE"

    # 3. Liquidity Check: Volume is 50% lower than the rolling average in state
    - condition: "daily_volume < (state.avg_ticker_volume * 0.5)"
      reason: "LOW_LIQUIDITY_WARNING"

  # Interaction: Human can 'Adjust Indicators', 'Acknowledge Risk', or 'Override Exit'
  interaction_mode: "TECHNICAL_VALIDATION"
  allow_state_mutation: true

# --- UPDATED GATEKEEPER EXIT ---
# Stage exits if momentum is confirmed OR if a human explicitly overrides the anomaly.
stage_exit_trigger: "(MA50 > MA200 AND RSI < 70 AND volatility_z_score < 3.0) OR (requires_intervention == False AND hitl_override == True)"

required: [tool_name, description, input_schema, output_schema, validation_rules, hitl_policy]