type: object
description: "Agnostic Tool Contract for Value at Risk (VaR) Quantitative Analysis"
properties:
  tool_name:
    type: string
    const: "calculate_var"
  description:
    type: string
    const: "Calculates Value at Risk (VaR) for a proposed trade based on historical volatility and 95% confidence intervals."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker, position_size]
    properties:
      ticker:
        type: string
        pattern: "^[A-Z]{1,5}$"
      position_size:
        type: number
        minimum: 0
        description: "The total dollar value of the proposed position."

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    required: [ticker, position_value, VaR_95, risk_percentage, is_within_limits]
    properties:
      ticker: { type: string }
      position_value: { type: number }
      VaR_95:
        type: number
        description: "The maximum expected loss at a 95% confidence level."
      risk_percentage:
        type: number
        description: "The numerical risk percentage (e.g., 0.035 for 3.5%)."
      is_within_limits:
        type: boolean
        description: "Internal check against firm-wide volatility constraints."

# --- GATEKEEPER PREDICATES ---
# Validation: VaR should never be greater than the total position.
# Also ensures ticker consistency.
validation_rules:
  - "VaR_95 < position_value"
  - "risk_percentage >= 0 AND risk_percentage <= 1"

# --- HITL ESCALATION POLICY ---
hitl_policy:
  trigger_conditions:
    # 1. Concentration Risk: Position size is unusually large compared to the state's total AUM
    - condition: "position_value > metadata.max_position_threshold"
      reason: "EXCESSIVE_CONCENTRATION"

    # 2. Boundary Condition: Risk is right on the edge (e.g., 4.9%)
    - condition: "risk_percentage >= 0.045 AND risk_percentage < 0.05"
      reason: "BOUNDARY_RISK_WARNING"

    # 3. Anomaly: Internal check says 'False' but the AgentPlanner is still pushing the trade
    - condition: "is_within_limits == False"
      reason: "LIMIT_VIOLATION_REQUIRED_REVIEW"

  # Define interaction: User must either 'APPROVE_EXCEPTION' or 'REJECT'
  interaction_mode: "EXCEPTION_HANDLING"
  allow_state_mutation: true

# Exit Condition: THE TRADE GATE
# We only exit the Risk Stage if the risk is under 5% AND the tool 
# explicitly confirms 'is_within_limits'.
stage_exit_trigger: "risk_percentage < 0.05 AND is_within_limits == True AND requires_intervention == False"

required: [tool_name, description, input_schema, output_schema, validation_rules, hitl_policy]