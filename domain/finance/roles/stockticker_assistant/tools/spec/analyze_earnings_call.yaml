type: object
description: "Agnostic Tool Contract for Earnings Call Transcription and Analysis"
properties:
  tool_name:
    type: string
    const: "analyze_earnings_call"
  description:
    type: string
    const: "Retrieves and summarizes the latest earnings call transcript, highlighting key executive sentiment and forward guidance."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker]
    properties:
      ticker:
        type: string
        pattern: "^[A-Z]{1,5}$"
        description: "The stock symbol (e.g., AAPL, TSLA)."

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    required: [summary, ticker, sentiment_score]
    properties:
      ticker: { type: string }
      summary:
        type: string
        description: "A consolidated narrative of the call."
      sentiment_score:
        type: number
        minimum: -1
        maximum: 1
        description: "Quantitative sentiment: -1 (Bearish) to 1 (Bullish)."
      has_forward_guidance:
        type: boolean
        description: "Whether the transcript contained future financial targets."

# --- GATEKEEPER PREDICATES ---
# Validation: Ensuring the analysis is mathematically sound and has data
validation_rules:
  - "sentiment_score >= -1 AND sentiment_score <= 1"
  - "summary exists AND ticker != ''"

# --- HITL ESCALATION POLICY ---
hitl_policy:
  trigger_conditions:
    # 1. Extraction Quality: Summary is too brief for an earnings call (likely a scraper error)
    - condition: "len(summary) < 200"
      reason: "POTENTIAL_DATA_TRUNCATION"

    # 2. Extreme Sentiment: Sentiment is +/- 0.9 (Very rare in corporate speak; check for hallucination)
    - condition: "abs(sentiment_score) > 0.9"
      reason: "EXTREME_SENTIMENT_ANOMALY"

    # 3. Discrepancy: Summary mentions "Growth" but sentiment_score is Negative
    - condition: "summary.contains('growth') AND sentiment_score < 0"
      reason: "SEMANTIC_DISCREPANCY"

  interaction_mode: "REVIEW_AND_REWRITE"
  allow_state_mutation: true

# Exit Condition: Only proceed to 'Valuation' if guidance was provided
# and sentiment isn't critically bearish (e.g., > -0.8)
stage_exit_trigger: "has_forward_guidance == True AND sentiment_score > -0.8 AND requires_intervention == False"

required: [tool_name, description, input_schema, output_schema, validation_rules, hitl_policy]