type: object
description: "Agnostic Tool Contract for Ticker-Specific News and Sentiment Retrieval"
properties:
  tool_name:
    type: string
    const: "search_ticker_news"
  description:
    type: string
    const: "Fetches the latest headlines and social velocity for a specific stock ticker."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker]
    properties:
      ticker:
        type: string
        pattern: "^[A-Z]{1,5}$"
        description: "Stock symbol to investigate (e.g., TSLA, BTC)."

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    properties:
      headlines:
        type: array
        description: "A list of headlines categorized by market sentiment."
        items:
          type: object
          required: [headline, sentiment]
          properties:
            headline: { type: string }
            sentiment:
              type: string
              enum: [Bullish, Bearish, Neutral]
    required: [headlines]

# --- GATEKEEPER PREDICATES ---
validation_rules:
  # Ensure the tool actually returned a list
  - "search_ticker_news exists"
  # Content check: The first news item must have a valid sentiment
  - "search_ticker_news.0.sentiment exists"

# --- HITL ESCALATION POLICY ---
hitl_policy:
  trigger_conditions:
    # 1. Total Sentiment Flip: The newest headline is Bearish while the rest are Bullish
    # Suggests a sudden "Breaking News" event that invalidates previous research.
    - condition: "search_ticker_news.0.sentiment == 'Bearish' AND search_ticker_news.1.sentiment == 'Bullish'"
      reason: "SENTIMENT_REVERSAL_DETECTED"

    # 2. Consensus Failure: 50/50 split between Bullish and Bearish items
    # The agent cannot find a clear direction; needs a human "Tie-Breaker."
    - condition: "count(sentiment=='Bullish') == count(sentiment=='Bearish')"
      reason: "MARKET_INDECISION_CONFLICT"

    # 3. Source Saturation: News is exclusively from social media sources (High Noise)
    # Requires custom logic to check source metadata.
    - condition: "all_sources_are_social(search_ticker_news) == True"
      reason: "HIGH_NOISE_SOCIAL_VELOCITY"

  interaction_mode: "SENTIMENT_AUDIT"
  allow_state_mutation: true

# --- UPDATED GATEKEEPER EXIT ---
# Stage exits if we have data, it's not Bearish at the top, 
# and a human hasn't flagged it for a reversal review.
stage_exit_trigger: "search_ticker_news.1 exists AND search_ticker_news.0.sentiment != 'Bearish' AND requires_intervention == False"

required: [tool_name, description, input_schema, output_schema, validation_rules, hitl_policy]
