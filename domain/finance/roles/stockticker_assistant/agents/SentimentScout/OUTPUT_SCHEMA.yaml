type: object
additionalProperties: false
required:
  - sentiment_score
  - sentiment_label
  - key_themes
  - confidence_score

properties:

  sentiment_score:
    type: number
    minimum: -1
    maximum: 1
    description: >
      Aggregate sentiment polarity.

  sentiment_label:
    type: string
    enum: [BULLISH, BEARISH, NEUTRAL]

  key_themes:
    type: array
    description: >
      Dominant narrative drivers influencing sentiment.
    items:
      type: string

  confidence_score:
    type: integer
    minimum: 1
    maximum: 10

