type: object
description: "Agnostic Tool Contract for Macro-Economic News Retrieval"
properties:
  tool_name:
    type: string
    const: "search_macro_news"
  description:
    type: string
    const: "Scans global financial news outlets for macro-economic themes, focusing on central bank policy and geopolitical risk."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    properties:
      query:
        type: string
        default: "Federal Reserve"
        description: "Focus area for the news scan (e.g., Inflation, Geopolitics)."

  # --- OUTPUT CONTRACT ---
  # The Gatekeeper will evaluate the array itself or its specific indices
  output_schema:
    type: array
    description: "A list of news headlines and their sources."
    items:
      type: object
      required: [source, headline]
      properties:
        source: { type: string }
        headline: { type: string }

# --- GATEKEEPER PREDICATES ---
validation_rules:
  # Ensure the tool actually returned an array (not a null or error string)
  - "search_macro_news exists"

# --- HITL ESCALATION POLICY ---
hitl_policy:
  trigger_conditions:
    # 1. Low Density: We have news, but fewer than 5 items (potential search failure)
    - condition: "NOT search_macro_news.4 exists"
      reason: "INSUFFICIENT_NEWS_DENSITY"

    # 2. Source Concentration: All news is coming from the same source (echo chamber risk)
    # Note: Requires a custom predicate function 'is_diversified'
    - condition: "is_diversified(search_macro_news) == False"
      reason: "SOURCE_BIAS_DETECTED"

    # 3. Keyword Redundancy: 80% of headlines contain the exact same string 
    # (Suggests a single news event is drowning out broader macro context)
    - condition: "semantic_overlap(search_macro_news) > 0.8"
      reason: "REDUNDANT_NEWS_SIGNAL"

  interaction_mode: "CURATE_AND_REFILTER"
  allow_state_mutation: true

# --- UPDATED GATEKEEPER EXIT ---
# Stage exits if we have at least 3 items AND no quality flags were raised.
stage_exit_trigger: "search_macro_news.2 exists AND requires_intervention == False"

required: [tool_name, description, input_schema, output_schema, validation_rules, hitl_policy]