type: object
description: "Agnostic Tool Contract for Live Brokerage Trade Execution"
properties:
  tool_name:
    type: string
    const: "execute_trade"
  description:
    type: string
    const: "Submits a live order to the brokerage. Requires valid ticker, side, and quantity."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker, side, qty]
    properties:
      ticker:
        type: string
        pattern: "^[A-Z]{1,5}$"
      side:
        type: string
        enum: [BUY, SELL]
      qty:
        type: integer
        minimum: 1
      order_type:
        type: string
        enum: [LIMIT, MARKET, STOP]
        default: "LIMIT"

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    required: [status, order_id, ticker, qty, avg_price, timestamp]
    properties:
      status:
        type: string
        enum: [FILLED, PARTIAL, REJECTED, PENDING]
      order_id: { type: string }
      ticker: { type: string }
      qty: { type: integer }
      avg_price: { type: number }
      timestamp: { type: string, format: date-time }
      execution_notes: { type: string }

  # --- GATEKEEPER PREDICATES ---
  validation_rules:
    # Consistency check: The brokerage must return the same ticker and quantity we requested
    - "ticker != '' AND qty > 0"
    # Execution safety: Price must be a positive number if filled
    - "status == 'REJECTED' OR avg_price > 0"
  
  # Exit Condition: THE SUCCESS GATE
  # The stage is only "Complete" if the order is confirmed as FILLED or 
  # safely PENDING in the order book.
  stage_exit_trigger: "status == 'FILLED' OR status == 'PENDING'"

required: [tool_name, description, input_schema, output_schema, validation_rules]