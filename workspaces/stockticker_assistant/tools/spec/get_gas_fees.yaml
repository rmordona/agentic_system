type: object
description: "Agnostic Tool Contract for Blockchain Network Fee Analysis"
properties:
  tool_name:
    type: string
    const: "get_gas_fees"
  description:
    type: string
    const: "Retrieves current Gwei prices and network congestion status to estimate trade slippage and transaction costs."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    properties:
      network:
        type: string
        default: "ethereum"
        enum: [ethereum, polygon, arbitrum, base, solana]
        description: "The blockchain network to query for fee data."

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    required: [network, base_fee_gwei, status]
    properties:
      network: { type: string }
      base_fee_gwei:
        type: number
        description: "The current base fee converted to a numeric float for logic comparison."
      status:
        type: string
        enum: [Low, Moderate, High, Extreme]
      priority_fee_suggestion:
        type: number
        description: "Suggested tip for miners/validators."

  # --- GATEKEEPER PREDICATES ---
  validation_rules:
    # Ensure we didn't get a negative fee or a null response
    - "base_fee_gwei >= 0"
    - "network exists"
  
  # Exit Condition: THE COST GATE
  # We only proceed to the next stage if the network is not in an 'Extreme' state
  # AND the base fee is under a specific threshold (e.g., 80 Gwei for Ethereum)
  stage_exit_trigger: "status != 'Extreme' AND base_fee_gwei < 80"

required: [tool_name, description, input_schema, output_schema, validation_rules]