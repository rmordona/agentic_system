type: object
description: "Agnostic Tool Contract for High-Precision Technical Stock Analysis"
properties:
  tool_name:
    type: string
    const: "get_ticker_stats"
  description:
    type: string
    const: "Returns high-precision technical data for a specific stock ticker, including Moving Averages, RSI, and Z-Score volatility."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker]
    properties:
      ticker:
        type: string
        description: "The stock symbol (e.g., AAPL, NVDA, TSLA)."
        pattern: "^[A-Z]{1,5}$"

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    required: 
      - ticker
      - current_price
      - MA50
      - MA200
      - RSI
      - volatility_z_score
      - daily_volume
    properties:
      ticker: { type: string }
      current_price: { type: number }
      MA50:
        type: number
        description: "50-day Simple Moving Average"
      MA200:
        type: number
        description: "200-day Simple Moving Average"
      RSI:
        type: number
        minimum: 0
        maximum: 100
        description: "Relative Strength Index (Momentum indicator)"
      volatility_z_score:
        type: number
        description: "Standard deviations from the mean price"
      daily_volume:
        type: integer
        minimum: 0

# Mandate the presence of identity metadata and schemas
required: [tool_name, description, input_schema, output_schema]