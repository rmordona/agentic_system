type: object
description: "Agnostic Tool Contract for High-Precision Technical Stock Analysis"
properties:
  tool_name:
    type: string
    const: "get_ticker_stats"
  description:
    type: string
    const: "Returns high-precision technical data for a specific stock ticker, including Moving Averages, RSI, and Z-Score volatility."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker]
    properties:
      ticker:
        type: string
        pattern: "^[A-Z]{1,5}$"
        description: "The stock symbol (e.g., AAPL, NVDA, TSLA)."

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    required: [ticker, current_price, MA50, MA200, RSI, volatility_z_score, daily_volume]
    properties:
      ticker: { type: string }
      current_price: { type: number }
      MA50: { type: number }
      MA200: { type: number }
      RSI: { type: number, minimum: 0, maximum: 100 }
      volatility_z_score: { type: number }
      daily_volume: { type: integer, minimum: 0 }

  # --- GATEKEEPER PREDICATES ---
  validation_rules:
    # Ensure RSI is physically possible and volume is significant
    - "RSI >= 0 AND RSI <= 100"
    - "current_price > 0 AND daily_volume > 0"
  
  # Exit Condition: THE MOMENTUM GATE
  # Example: Only proceed if the stock is in a Golden Cross (MA50 > MA200)
  # AND not "Overbought" (RSI < 70) 
  # AND volatility is not in an extreme outlier state (Z-Score < 3)
  stage_exit_trigger: "MA50 > MA200 AND RSI < 70 AND volatility_z_score < 3.0"

required: [tool_name, description, input_schema, output_schema, validation_rules]