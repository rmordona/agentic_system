type: object
description: "Agnostic Tool Contract for Earnings Call Transcription and Analysis"
properties:
  tool_name:
    type: string
    const: "analyze_earnings_call"
  description:
    type: string
    const: "Retrieves and summarizes the latest earnings call transcript, highlighting key executive sentiment and forward guidance."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker]
    properties:
      ticker:
        type: string
        pattern: "^[A-Z]{1,5}$"
        description: "The stock symbol (e.g., AAPL, TSLA)."

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: object
    required: [summary, ticker, sentiment_score]
    properties:
      ticker: { type: string }
      summary:
        type: string
        description: "A consolidated narrative of the call."
      sentiment_score:
        type: number
        minimum: -1
        maximum: 1
        description: "Quantitative sentiment: -1 (Bearish) to 1 (Bullish)."
      has_forward_guidance:
        type: boolean
        description: "Whether the transcript contained future financial targets."

  # --- GATEKEEPER PREDICATES ---
  # Validation: Ensuring the analysis is mathematically sound and has data
  validation_rules:
    - "sentiment_score >= -1 AND sentiment_score <= 1"
    - "summary exists AND ticker != ''"
  
  # Exit Condition: Only proceed to 'Valuation' if guidance was provided
  # and sentiment isn't critically bearish (e.g., > -0.8)
  stage_exit_trigger: "has_forward_guidance == True AND sentiment_score > -0.8"

required: [tool_name, description, input_schema, output_schema, validation_rules]