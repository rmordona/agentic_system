type: object
description: "Agnostic Tool Contract for Ticker-Specific News and Sentiment Retrieval"
properties:
  tool_name:
    type: string
    const: "search_ticker_news"
  description:
    type: string
    const: "Fetches the latest headlines and social velocity for a specific stock ticker."

  # --- INPUT HANDSHAKE ---
  input_schema:
    type: object
    required: [ticker]
    properties:
      ticker:
        type: string
        description: "Stock symbol to investigate (e.g., TSLA, BTC)."

  # --- OUTPUT CONTRACT ---
  output_schema:
    type: array
    description: "A list of headlines categorized by market sentiment."
    items:
      type: object
      required: [headline, sentiment]
      properties:
        headline:
          type: string
        sentiment:
          type: string
          enum: [Bullish, Bearish, Neutral]

# Mandate the presence of identity metadata and schemas
required: [tool_name, description, input_schema, output_schema]