type: object
additionalProperties: false
required:
  - signals
  - price_targets
  - confidence_score
  - technical_bias
  - validity

properties:

  # ---------------------------------------------------------------------------
  # Technical Signals
  # ---------------------------------------------------------------------------
  signals:
    type: array
    minItems: 1
    description: >
      List of computed technical indicators and their evaluated bias.
    items:
      type: object
      additionalProperties: false
      required:
        - indicator
        - value
        - bias
      properties:
        indicator:
          type: string
          description: >
            Name of the technical indicator (e.g. RSI, MACD, VWAP).

        value:
          type: number
          description: >
            Raw numeric value produced by the indicator.

        bias:
          type: string
          enum: [BULLISH, BEARISH, NEUTRAL]
          description: >
            Directional interpretation of the indicator.

  # ---------------------------------------------------------------------------
  # Aggregate Technical Direction
  # ---------------------------------------------------------------------------
  technical_bias:
    type: string
    enum: [BULLISH, BEARISH, NEUTRAL]
    description: >
      Overall technical bias derived from the full signal set.
      Used directly by downstream predicates and planners.

  # ---------------------------------------------------------------------------
  # Price Targets (Non-Executable Guidance)
  # ---------------------------------------------------------------------------
  price_targets:
    type: object
    additionalProperties: false
    required:
      - entry
      - stop_loss
      - take_profit
    properties:
      entry:
        type: number
        description: >
          Statistically optimal entry price based on models.

      stop_loss:
        type: number
        description: >
          Risk-invalidating price level (not position-sized).

      take_profit:
        type: number
        description: >
          Expected favorable exit price based on projections.

  # ---------------------------------------------------------------------------
  # Confidence & Validity
  # ---------------------------------------------------------------------------
  confidence_score:
    type: integer
    minimum: 1
    maximum: 10
    description: >
      Quantified confidence level based on statistical strength.

  validity:
    type: object
    additionalProperties: false

